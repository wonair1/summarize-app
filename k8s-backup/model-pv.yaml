apiVersion: v1
kind: PersistentVolume
metadata:
  name: model-pv
spec:
  capacity:
    storage: 2Gi

  accessModes:
    - ReadOnlyMany

  persistentVolumeReclaimPolicy: Retain

  storageClassName: model-local

  local:
    path: /root/summarize-app/models/t5-small

  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node02
