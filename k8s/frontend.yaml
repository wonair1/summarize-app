apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: frontend
          image: myregistry.com/frontend:latest
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: "http://backend:8000/summarize"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 8501
      targetPort: 8501
